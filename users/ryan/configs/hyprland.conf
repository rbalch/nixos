monitor=DP-1,7680x2160@120,0x0,1.25
monitor=,preferred,auto,auto

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# No-op on Cortex, where Wayle owns awww. Other hosts still use Waybar.
exec-once=~/.config/hypr/start-wallpaper.sh
exec-once=hyprctl setcursor GoogleDot-Blue 28
exec-once=[workspace 1 silent] code
exec-once=[workspace 1 silent] google-chrome-stable
exec-once=handy   # dictation daemon; toggle recording with Hyper+Space
exec-once=~/.config/hypr/start-blueman-applet.sh

# audio
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# video
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

xwayland {
    force_zero_scaling = true
}

env = XCURSOR_SIZE,30

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = master
}

master {
    # Center master: master sits in the middle, side stacks left + right.
    # Kicks in once there are ≥2 stack windows (i.e., 3+ total).
    orientation = center
    # New windows go into the stack instead of becoming master.
    new_status = slave
    mfact = 0.5
}

decoration {
    rounding = 10
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# 3-finger swipe to switch workspaces
bind = , swipe:3:r, workspace, e-1
bind = , swipe:3:l, workspace, e+1

$mainMod = SUPER

bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod, W, Close window, killactive,
bindd = $mainMod, T, Toggle window floating, togglefloating,
bindd = CTRL ALT, E, Nautilus file manager, exec, nautilus
bindd = $mainMod, SPACE, App launcher, exec, wofi --normal-window --show drun
bindd = $mainMod, K, Show keybindings, exec, ~/.config/hypr/keybindings-menu.sh
bindd = $mainMod, F, Toggle full screen, fullscreen,
bindd = $mainMod, M, Move window to master, layoutmsg, swapwithmaster
bindd = $mainMod, RETURN, Terminal, exec, ghostty
bindd = $mainMod SHIFT, RETURN, Browser, exec, google-chrome-stable
bindd = $mainMod SHIFT, F, File manager, exec, cosmic-files

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, Focus window left, movefocus, l
bindd = $mainMod, right, Focus window right, movefocus, r
bindd = $mainMod, up, Focus window up, movefocus, u
bindd = $mainMod, down, Focus window down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Super+Shift+arrows → swap tile positions (mirrors movefocus)
bindd = $mainMod SHIFT, left, Swap window left, swapwindow, l
bindd = $mainMod SHIFT, right, Swap window right, swapwindow, r
bindd = $mainMod SHIFT, up, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, down, Swap window down, swapwindow, d

# Super+Alt+arrows → resize (moved off Super+Shift to make room for swap)
binde = $mainMod ALT, right, resizeactive, 30 0
binde = $mainMod ALT, left, resizeactive, -30 0
binde = $mainMod ALT, up, resizeactive, 0 -30
binde = $mainMod ALT, down, resizeactive, 0 30

# Meh (Ctrl+Alt+Shift, single key on Moonlander) → snap to region.
# Arrows = halves, Y/U/B/N = corners in a 2x2 grid (Y=TL, U=TR, B=BL, N=BR).
# These fire from inside any app.
bindd = CTRL ALT SHIFT, left, Snap window left, exec, ~/.config/hypr/snap.sh left
bindd = CTRL ALT SHIFT, right, Snap window right, exec, ~/.config/hypr/snap.sh right
bindd = CTRL ALT SHIFT, up, Snap window top, exec, ~/.config/hypr/snap.sh top
bindd = CTRL ALT SHIFT, down, Snap window bottom, exec, ~/.config/hypr/snap.sh bottom
bindd = CTRL ALT SHIFT, Y, Snap window top-left, exec, ~/.config/hypr/snap.sh tl
bindd = CTRL ALT SHIFT, U, Snap window top-right, exec, ~/.config/hypr/snap.sh tr
bindd = CTRL ALT SHIFT, B, Snap window bottom-left, exec, ~/.config/hypr/snap.sh bl
bindd = CTRL ALT SHIFT, N, Snap window bottom-right, exec, ~/.config/hypr/snap.sh br

# Meh+S — region screenshot to clipboard
bindd = CTRL ALT SHIFT, S, Copy region screenshot, exec, grim -g "$(slurp)" - | wl-copy

# Ctrl+Alt+Space works on standard keyboards; keep Hyper+Space for the Moonlander.
# Keep both a standard-keyboard chord and Hyper+Space for the Moonlander.
bindd = CTRL ALT, SPACE, Toggle dictation, exec, handy --toggle-transcription
bindd = SUPER CTRL ALT SHIFT, SPACE, Toggle dictation, exec, handy --toggle-transcription
# Hyper+H: Handy transcription with LLM post-processing.
bindd = SUPER CTRL ALT SHIFT, H, Toggle processed dictation, exec, handy --toggle-post-process

# sleep and lock
bindd = SUPER, L, Lock screen, exec, loginctl lock-session
# Alternate lock chord.
bindd = CTRL ALT, L, Lock screen, exec, loginctl lock-session
# SUPER+ESCAPE = power menu (lock / screen off / suspend / logout / reboot / shutdown)
bindd = SUPER, ESCAPE, Power menu, exec, ~/.config/hypr/power-menu.sh

# chrome maximize suppression: hyprland manages window state, not chrome.
# fullscreen events pass through so YouTube/Plex fullscreen buttons work in one click.
# if escape-from-fullscreen starts nuking window geometry again, add `fullscreen` back.
windowrule = suppress_event maximize class:^(google-chrome)$

# GTK portal file dialogs (Chrome "Save Link As", etc) spawn absurdly wide.
# The GTK file chooser overrides any windowrule `size` with its own configure
# after map, so we react to the openwindow IPC event in portal-resize.sh.
# Affects portal-routed dialogs: Chrome, Electron apps, Flatpaks, etc.
windowrule = float class:^(xdg-desktop-portal-gtk)$
exec-once = ~/.config/hypr/portal-resize.sh

# vscode fix
env = NIXOS_OZONE_WL,1

# dark mode
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
