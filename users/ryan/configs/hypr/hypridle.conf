general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    # Chrome can leave its Wayland idle block set after a video stops. It also
    # sends a D-Bus Video Wake Lock while video is playing, which remains on.
    ignore_wayland_inhibit = true
}

# lock after 8 min
listener {
    timeout = 480
    on-timeout = loginctl lock-session
}

# Turn off monitors after 10 min.
#
# Known intermittent hazard, kept deliberately: on this NVIDIA card the
# DPMS-off/on cycle occasionally fails inside NVKMS and takes the display
# stack with it. Twice so far — 2026-06-14 (glitched hyprlock + dead USB
# input, recovered with a by-hand suspend/resume) and 2026-07-27 17:46:40,
# which hard-locked the box, power-button-only:
#   [drm:nv_drm_gem_alloc_nvkms_memory_ioctl [nvidia_drm]] *ERROR*
#   [nvidia-drm] [GPU ID 0x00000100] Failed to allocate NVKMS memory
#
# Rejected alternatives, so nobody re-litigates them:
#   - `systemctl suspend` — suspend is by-hand-only on this box.
#   - DDC/CI panel power-off — the Odyssey G95NC doesn't implement VCP D6.
#
# Keep this timer despite that risk. Hypridle now runs as one Home Manager
# service and rebuilds do not stop it.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
